name: CI

# Runs on every branch and on pull requests targeting the maintained base, so a
# new commit is always validated. The previous configuration only triggered on
# two specific branch names, which meant most pushes were never checked.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests set their own isolated database path; this is a belt-and-braces
      # guard so no job can touch a checked-in database file.
      INVESTPILOT_DB_PATH: ./data/investpilot.test.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
