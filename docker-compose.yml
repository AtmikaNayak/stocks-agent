version: '3.8'

services:
  app:
    build: .
    container_name: investpilot-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Required: sessions cannot be signed without it. Compose fails fast
      # rather than starting a server that silently refuses every login.
      - INVESTPILOT_SESSION_SECRET=${INVESTPILOT_SESSION_SECRET:?set INVESTPILOT_SESSION_SECRET to 32+ random characters}
      # Comma-separated exact user IDs allowed to trigger jobs/scans.
      # Empty by default: nobody gets operator privileges.
      - INVESTPILOT_SYSTEM_ADMIN_USER_IDS=${INVESTPILOT_SYSTEM_ADMIN_USER_IDS:-}
    volumes:
      - investpilot_data:/app/data

  worker:
    build: .
    container_name: investpilot-worker
    restart: always
    command: ["npm", "run", "worker"]
    volumes:
      - investpilot_data:/app/data

volumes:
  investpilot_data:
